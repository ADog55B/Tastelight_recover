<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>标题 - Tastelight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #ffffff; color: #111; font-family: 'Noto Serif SC', "Songti SC", "STSong", "SimSun", serif; }
    .container { max-width: 720px; margin: 0 auto; padding: 4rem 1.5rem 5rem; }
    .title { font-size: 1.6rem; font-weight: bold; text-align: center; margin-bottom: 3rem; }
    .content { line-height: 1.8; white-space: pre-line; font-size: 1.05rem; color: #333; }
    hr { border: none; border-top: 1px solid #eee; margin: 4rem auto; width: 30%; }
    .back-btn { display: block; text-align: center; color: #666; text-decoration: none; font-size: 0.9rem; }
    .back-btn:hover { color: #111; }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">羞耻</div>

    <div class="content">
      2020-05-17 03:22:51

        把你的脑壳敲了一个洞
        把你的关节撞碎
        把你的骨髓抽出来换成唾沫
        把你的诗歌摆出来供人讥笑
        你这个 妓女 没出息的 蛆
        你这个 庸才
        你这个 缺乏自尊心的 烂货
        让你再也无法产生自我厌恶以外的情感
        让你挥拳打向自己
        往你的血管里注射羞耻
        让你羞耻
        让你羞耻
        让你应该为自己感到羞耻
    </div>

    <hr>

    <a href="/haley_poems" class="back-btn">← 返回列表</a>
  </div>
</body>
