    <div class="content">
      2020-01-06 05:48:57

    咬紧牙关， 我铁蓝色防备的脸。
    冰冷坚硬的空气， 我永不原谅的宣言。
    浑身僵直，我等待瓦解的时刻。
    在死的冷中，我等待爱。
