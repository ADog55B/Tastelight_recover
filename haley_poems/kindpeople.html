<body>
  <div class="container">
    <div class="title">妓女</div>

    <div class="content">
      2020-02-26 00:13:24

    今年我要穿得像一位妓女
    向世界施舍性欲
    我要穿上渔网袜，让肉欲从网格里挤出来
    当我跳舞，我会尽情抖动我的丰乳和肥臀
    让汗水黏满全身亮晶晶
    如同加缪描写的“一个出水的淫亵女神”
    我要无耻而激动地燃烧自己
    在道德之外的田野里
    </div>
